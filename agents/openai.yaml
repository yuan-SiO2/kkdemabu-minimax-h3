interface:
  display_name: "MiniMax H3 剧本转分镜（三阶段）"
  short_description: "时间码脚本、分镜档案、逐镜 H3 视频提示词（文戏、武戏、场面、MV）"
  default_prompt: "Use $kkdemabu-minimax-h3 to read history/learnings.md, then start with the four questions exactly as defined in SKILL.md 开工确认（四问只在那张表里：语言／节奏／画风／脚本风格）：把候选写全（每问 2–3 个）并把默认那个标出来，串成一行发出；这是提问不是结论——用户点头前不建目录、不写文件、不改档案、不动剧本「手法」行。阶段不问，按输入判（故事／小说→阶段一，剧本.md→阶段二，已有阶段二事件档案.json→阶段三）；画幅／参考图／MV 按输入推断；每 5 镜一批增量写盘是推进方式，不进提问。Then 阶段一 写 <项目名>/剧本.md（时间码脚本＋因果线／夸张线检查表）；阶段二 写 <项目名>/阶段二事件档案.json（五件档案＋分镜情节）；阶段三 写 <项目名>/阶段三视频文本.json（逐镜，照 references/writing.md 与 references/example.md，用 视觉钩子／强度／尺度锚点 三把尺），跑 13 条交付自检，最后回复目录树＋集数＋总镜数。节奏已定的那种交界处理照做：逐阶段停＝报产物路径＋下一阶段吃什么＋一句看点后收尾；一次跑到底＝直接进下一阶段；都不问「要不要继续」。"
